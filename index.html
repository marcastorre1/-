<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Я твой рот ебал❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(circle at center, #5a1028 0%, #1b0610 45%, #050106 100%);
    font-family: Arial, sans-serif;
    color: white;
}

button {
    padding: 18px 42px;
    border: 0;
    border-radius: 50px;
    background: linear-gradient(135deg, #ff174f, #ff5b87);
    color: white;
    font-size: 21px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 0 20px #ff174f, 0 0 55px #ff174f55;
    transition: .3s;
}

button:hover {
    transform: scale(1.08);
}

button:active {
    transform: scale(.95);
}

#scene {
    display: none;
    position: relative;
    width: 650px;
    height: 620px;
}

.heart-text {
    position: absolute;
    color: #ff6b91;
    font-size: 15px;
    font-weight: bold;
    white-space: nowrap;
    opacity: 0;
    text-shadow:
        0 0 5px #ff174f,
        0 0 12px #ff174f,
        0 0 25px #ff174f;
    animation: textIn 1.4s ease forwards;
}

@keyframes textIn {
    0% {
        opacity: 0;
        transform: scale(.1) rotate(-10deg);
    }

    70% {
        opacity: 1;
        transform: scale(1.15) rotate(3deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0);
    }
}

.center {
    position: absolute;
    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%) scale(.1);

    width: 360px;
    padding: 25px;

    text-align: center;
    font-size: 34px;
    font-weight: 900;

    color: white;

    opacity: 0;
    z-index: 20;

    text-shadow:
        0 0 10px #ff174f,
        0 0 25px #ff174f,
        0 0 55px #ff174f;

    animation: centerIn 1.7s 2.8s forwards;
}

@keyframes centerIn {
    0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(.1);
    }

    65% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.15);
    }

    100% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
    }
}

.glow {
    position: absolute;
    left: 50%;
    top: 50%;

    width: 280px;
    height: 280px;

    transform: translate(-50%, -50%);
    border-radius: 50%;

    background: #ff174f22;
    filter: blur(50px);

    animation: pulse 1.5s infinite alternate;
}

@keyframes pulse {
    from {
        transform: translate(-50%, -50%) scale(.8);
        opacity: .4;
    }

    to {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: .9;
    }
}

.float-heart {
    position: fixed;
    bottom: -40px;
    font-size: 20px;
    pointer-events: none;
    animation: floatUp linear forwards;
}

@keyframes floatUp {
    0% {
        opacity: 0;
        transform: translateY(0) rotate(0);
    }

    15% {
        opacity: 1;
    }

    100% {
        opacity: 0;
        transform: translateY(-110vh) rotate(360deg);
    }
}

@media (max-width: 700px) {
    #scene {
        transform: scale(.62);
    }

    .center {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<button id="start" onclick="start()">Нажми ❤️</button>

<div id="scene">

    <div class="glow"></div>

    <div class="center">
        Я ТВОЙ РОТ ЕБАЛ😂❤️
    </div>

</div>

<script>

function start() {

    document.getElementById("start").style.display = "none";

    const scene = document.getElementById("scene");

    scene.style.display = "block";

    const cx = 325;
    const cy = 300;
    const scale = 19;

    let delay = 0;

    /*
        Математическая форма сердца
    */

    for (let t = 0; t < Math.PI * 2; t += 0.035) {

        const x = 16 * Math.pow(Math.sin(t), 3);

        const y =
            13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t);

        const text = document.createElement("div");

        text.className = "heart-text";
        text.textContent = "ТОСТАР ГОМИК";

        text.style.left =
            (cx + x * scale) + "px";

        text.style.top =
            (cy - y * scale) + "px";

        text.style.animationDelay =
            delay + "s";

        scene.appendChild(text);

        delay += 0.012;
    }

    startFloatingHearts();
}


/* Летающие сердечки */

function startFloatingHearts() {

    setInterval(() => {

        const heart =
            document.createElement("div");

        heart.className = "float-heart";

        heart.textContent =
            Math.random() > .3 ? "❤️" : "✨";

        heart.style.left =
            Math.random() * 100 + "vw";

        heart.style.fontSize =
            (12 + Math.random() * 25) + "px";

        heart.style.animationDuration =
            (3 + Math.random() * 3) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6500);

    }, 350);
}

</script>

</body>
</html>
